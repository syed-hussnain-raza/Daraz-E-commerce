<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png" />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Grid only -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/footer.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <title>
      Online Shopping in Pakistan: Fashion, Electronics & Groceries - Daraz.pk
    </title>
  </head>

  <body>
    <!-- Header -->
    <header></header>

    <!-- Main Section -->
    <main>
      <!-- Hero: carousel + app download card -->
      <section class="hero-section">
        <div class="hero-inner">
          <!-- Carousel -->
          <div class="carousel-wrapper">
            <div class="carousel-track" id="carousel-track"></div>

            <!-- Prev / Next buttons -->
            <button
              class="carousel-btn carousel-btn--prev"
              id="btn-prev"
              aria-label="Previous slide"
            >
              <img
                src="../assets/icons/chevron.png"
                alt="Previous"
                class="chevron chevron--left"
              />
            </button>
            <button
              class="carousel-btn carousel-btn--next"
              id="btn-next"
              aria-label="Next slide"
            >
              <img
                src="../assets/icons/chevron.png"
                alt="Next"
                class="chevron chevron--right"
              />
            </button>

            <!-- Dot indicators -->
            <div class="carousel-dots" id="carousel-dots"></div>
          </div>

          <!-- App download card -->
          <div class="app-card">
            <div class="app-card-top">
              <img
                src="../assets/icons/app-logo.png"
                alt="Daraz App"
                class="app-logo"
              />
              <span class="app-title">TRY DARAZ APP</span>
            </div>

            <div class="app-card-body">
              <div class="app-rating">
                <img src="../assets/images/star.png" alt="star" />
                <span>4.8 Rated</span>
              </div>
              <p class="app-tagline">Download the App now</p>
              <div class="app-features">
                <div class="app-feature">
                  <img
                    src="../assets/images/free-shipping.png"
                    alt="Free Shipping"
                  />
                  <span>Free <br />Shipping</span>
                </div>
                <div class="app-feature">
                  <img
                    src="../assets/images/exclusive-voucher.png"
                    alt="Exclusive Vouchers"
                  />
                  <span>Exclusive <br />Vouchers</span>
                </div>
              </div>
            </div>

            <div class="app-card-footer">
              <img
                src="../assets/images/qr-code.png"
                alt="QR Code"
                class="qr-code"
              />
              <div class="store-btns">
                <img
                  src="../assets/icons/appstore.png"
                  alt="App Store"
                  class="store-btn"
                />
                <img
                  src="../assets/icons/playstore.png"
                  alt="Google Play"
                  class="store-btn"
                />
              </div>
            </div>

            <p class="app-footer-text">Download the App Now!</p>
          </div>
        </div>
      </section>

      <!-- Banner Image -->
      <a
        class="d-flex justify-content-center align-content-center p-3"
        href="#"
      >
        <img src="../assets/products/banner.gif" alt="" />
      </a>

      <!-- Flash Sale -->
      <section class="flash-sale">
        <h2 class="section-title">Flash Sale</h2>
        <div class="flash-sale-container">
          <div class="flash-sale-subrow">
            <span class="flash-sale-tab">On Sale Now</span>
            <button class="flash-sale-btn">SHOP ALL PRODUCTS</button>
          </div>
          <div
            class="row flash-sale-cards pb-3 gx-2"
            id="flash-sale-cards"
          ></div>
        </div>
      </section>

      <!-- Categories -->
      <section class="categories">
        <h2 class="section-title">Categories</h2>
        <div class="categories-container">
          <div class="categories-grid" id="categories-grid"></div>
        </div>
      </section>

      <!-- Just For You -->
      <section class="just-for-you">
        <h2 class="section-title">Just For You</h2>
        <div class="jfy-container">
          <div class="row gx-2 gy-3" id="jfy-cards"></div>
        </div>
        <div class="load-more-container">
          <button class="jfy-load-btn">LOAD MORE</button>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer"></footer>

    <!-- Side Navigator -->
    <nav class="side-nav" id="side-nav">
      <button
        class="side-nav-item side-nav-top"
        id="nav-top"
        aria-label="Back to top"
      >
        <i class="bi bi-chevron-up"></i>
      </button>
      <button
        class="side-nav-item"
        data-section="flash-sale"
        aria-label="Flash Sale"
      >
        <i class="bi bi-fire"></i>
        <span class="side-nav-label">Flash Sale</span>
      </button>
      <button
        class="side-nav-item"
        data-section="categories"
        aria-label="Categories"
      >
        <i class="bi bi-grid-3x3-gap-fill"></i>
        <span class="side-nav-label">Categories</span>
      </button>
      <button
        class="side-nav-item"
        data-section="just-for-you"
        aria-label="Just For You"
      >
        <i class="bi bi-person-check"></i>
        <span class="side-nav-label">Just For You</span>
      </button>
    </nav>

    <!-- Floating Messages Button -->
    <a href="#" class="float-messages" aria-label="Messages">
      <i class="bi bi-chat-left-fill"></i>
      <span>Messages</span>
    </a>

    <!-- Scripts: utils, header, footer, main -->
    <script src="../js/utils.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
